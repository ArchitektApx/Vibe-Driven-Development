name: Verify

# pull_request, never pull_request_target: this checks out and runs content
# from the PR head, so it must not have write access or secrets.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A broken manifest breaks install for every user, and there is no
      # staged rollout to catch it.
      - name: Validate JSON manifests
        run: |
          rc=0
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || { echo "missing manifest: $f"; rc=1; continue; }
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" \
              || { echo "invalid JSON: $f"; rc=1; }
          done
          exit $rc

      # The marketplace entry and plugin.json describe the same plugin. If the
      # names diverge, /plugin install resolves one and the loader reads the
      # other. Version drift is not fatal but is always a mistake, so it fails
      # too rather than shipping a release that lies about itself.
      - name: Marketplace and plugin manifest agree
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const p = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const entry = (m.plugins || []).find(e => e.name === p.name);
            if (!entry) { console.error(`marketplace.json has no plugin named ${p.name}`); process.exit(1); }
            if (entry.version !== p.version) {
              console.error(`version drift: marketplace ${entry.version} vs plugin.json ${p.version}`);
              process.exit(1);
            }
            if (entry.source !== "./") {
              console.error(`plugin ${p.name} sources from ${JSON.stringify(entry.source)}, expected "./" (this repo)`);
              process.exit(1);
            }
          '

      - name: Check every skill has frontmatter
        run: |
          rc=0
          while IFS= read -r f; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "missing frontmatter: $f"; rc=1; }
            grep -qE '^name:' "$f" || { echo "missing name: $f"; rc=1; }
            grep -qE '^description:' "$f" || { echo "missing description: $f"; rc=1; }
          done < <(find skills -name SKILL.md)
          exit $rc

      # `npx skills add` installs flat by frontmatter name, so two skills with
      # the same name silently clobber each other on the user's machine.
      - name: Skill names are unique
        run: |
          dupes=$(grep -h '^name:' skills/*/SKILL.md | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate skill names:"; echo "$dupes"; exit 1
          fi

      # A pointer that names a file which does not ship is invisible until a
      # reader follows it and finds nothing. Skill files and Reference files
      # are checked alike, because a dangling link inside a Reference file
      # strands its reader the same way.
      - name: Relative links under skills resolve
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            const external = (t) => /^[a-z][a-z0-9+.-]*:/i.test(t) || t.startsWith("/") || t.startsWith("#");
            let rc = 0;
            for (const f of walk("skills").filter((p) => p.endsWith(".md"))) {
              const raw = fs.readFileSync(f, "utf8");
              for (const m of raw.matchAll(/\[[^\]]*\]\(([^)\s]+)/g)) {
                const target = decodeURIComponent(m[1].trim().split(/[#?]/)[0]);
                if (!target || external(target)) continue;
                if (!fs.existsSync(path.join(path.dirname(f), target))) {
                  console.error(`${f}: link resolves to nothing: ${target}`);
                  rc = 1;
                }
              }
            }
            process.exit(rc);
          '

      # A file under a skill directory that its skill file does not link is a
      # file no reader can be sent to. The index section every split skill
      # carries is what makes a direct link enough, so this needs no
      # transitive crawl.
      - name: Every file under a skill is linked from its skill file
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            const external = (t) => /^[a-z][a-z0-9+.-]*:/i.test(t) || t.startsWith("/") || t.startsWith("#");
            let rc = 0;
            for (const entry of fs.readdirSync("skills", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const root = path.join("skills", entry.name);
              const skill = path.join(root, "SKILL.md");
              if (!fs.existsSync(skill)) {
                console.error(`${root}: no SKILL.md`);
                rc = 1;
                continue;
              }
              const linked = new Set();
              for (const m of fs.readFileSync(skill, "utf8").matchAll(/\[[^\]]*\]\(([^)\s]+)/g)) {
                const target = decodeURIComponent(m[1].trim().split(/[#?]/)[0]);
                if (!target || external(target)) continue;
                linked.add(path.normalize(path.join(root, target)));
              }
              for (const f of walk(root)) {
                if (path.normalize(f) === path.normalize(skill)) continue;
                if (!linked.has(path.normalize(f))) {
                  console.error(`${f}: no direct link from ${skill}`);
                  rc = 1;
                }
              }
            }
            process.exit(rc);
          '

      # A hosted Code-Reviewer compares its own Spawn prompt against this
      # sentence word for word to decide whether to invoke the PR-Author, so
      # the copy in the Orchestrator skill's Spawn prompt template and the
      # copy in the Code-Reviewer's own test must read identically. The
      # `canonical` string below is the enforcing authority: change the
      # sentence in a skill and this step fails until the same change lands
      # here too.
      - name: Orchestrator and Code-Reviewer agree on the canonical sentence
        run: |
          node -e '
            const fs = require("fs");
            const canonical = "An Orchestrator hosts this Workflow.";
            const files = [
              "skills/vdd-orchestrator/SKILL.md",
              "skills/vdd-code-reviewer/SKILL.md",
            ];
            let rc = 0;
            for (const f of files) {
              const raw = fs.readFileSync(f, "utf8");
              const count = raw.split(canonical).length - 1;
              if (count !== 1) {
                console.error(`${f}: expected exactly one occurrence of "${canonical}", found ${count}`);
                rc = 1;
              }
            }
            process.exit(rc);
          '

      # CLAUDE.md is read by Claude Code and wins precedence over AGENTS.md,
      # so a house rule added only to AGENTS.md would silently never reach
      # Claude Code, and a rule added to both would be read twice.
      - name: CLAUDE.md is a stub for AGENTS.md
        run: |
          if [ "$(cat CLAUDE.md)" != "@AGENTS.md" ]; then
            echo "CLAUDE.md must contain exactly the line: @AGENTS.md"
            exit 1
          fi

      # This repository is prose only. Hooks, MCP servers, symlinks and
      # executables all end up on every installer's machine and none of them
      # is needed here. If one is ever added deliberately, edit this step in
      # the same PR so the reviewer sees both.
      - name: Reject executable surface
        run: |
          rc=0
          while IFS= read -r entry; do
            mode=${entry%% *}
            case "$mode" in
              120000) echo "symlink in distributed content: ${entry#* }"; rc=1 ;;
              100755) echo "executable in distributed content: ${entry#* }"; rc=1 ;;
            esac
          done < <(git ls-files -s | awk '{print $1" "$4}')
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if grep -qE '"(hooks|mcpServers)"' "$f"; then
              echo "$f declares hooks or MCP servers; this plugin ships neither"; rc=1
            fi
          done
          while IFS= read -r f; do
            echo "unexpected hook or MCP config: $f"; rc=1
          done < <(git ls-files | grep -E '(^|/)(hooks\.json|\.mcp\.json|mcp\.json)$' || true)
          exit $rc
