name: Verify

# pull_request, never pull_request_target: this checks out and runs content
# from the PR head, so it must not have write access or secrets. A push to
# any branch runs it too, so a branch shows its check before a PR exists.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A broken manifest breaks install for every user, and there is no
      # staged rollout to catch it. The marketplace entry and both plugin
      # manifests describe the same plugin: Codex reads .codex-plugin/ and
      # ignores .claude-plugin/plugin.json once its own exists, so a field
      # changed in one drifts silently. Version drift is always a mistake,
      # so it fails too rather than shipping a release that lies about itself.
      - name: Manifests parse and agree
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => {
              try { return JSON.parse(fs.readFileSync(f, "utf8")); }
              catch (e) { console.error(`missing or invalid JSON: ${f}: ${e.message}`); process.exit(1); }
            };
            const m = read(".claude-plugin/marketplace.json");
            const p = read(".claude-plugin/plugin.json");
            const c = read(".codex-plugin/plugin.json");
            let rc = 0;
            const entry = (m.plugins || []).find(e => e.name === p.name);
            if (!entry) { console.error(`marketplace.json has no plugin named ${p.name}`); process.exit(1); }
            if (entry.version !== p.version) {
              console.error(`version drift: marketplace ${entry.version} vs plugin.json ${p.version}`); rc = 1;
            }
            if (entry.source !== "./") {
              console.error(`plugin ${p.name} sources from ${JSON.stringify(entry.source)}, expected "./" (this repo)`); rc = 1;
            }
            // Every field the two plugin manifests both carry agrees, hooks
            // excepted: only the Codex manifest carries the one hook. The
            // fields Codex repeats must be there in both.
            const repeated = ["name", "version", "description", "author", "homepage", "repository", "license", "keywords"];
            for (const k of repeated) {
              if (!(k in p) || !(k in c)) {
                console.error(`${k} is missing from ${k in p ? ".codex-plugin" : ".claude-plugin"}/plugin.json`); rc = 1;
              }
            }
            for (const k of Object.keys(p).filter((k) => k in c && k !== "hooks")) {
              if (JSON.stringify(p[k]) !== JSON.stringify(c[k])) {
                console.error(`.codex-plugin/plugin.json ${k} differs from .claude-plugin/plugin.json`); rc = 1;
              }
            }
            process.exit(rc);
          '

      # A Harness finds a skill by the name and description in its
      # frontmatter, so a SKILL.md without them is a skill nobody loads.
      - name: Check every skill has frontmatter
        run: |
          rc=0
          while IFS= read -r f; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "missing frontmatter: $f"; rc=1; }
            grep -qE '^name:' "$f" || { echo "missing name: $f"; rc=1; }
            grep -qE '^description:' "$f" || { echo "missing description: $f"; rc=1; }
          done < <(find skills -name SKILL.md)
          exit $rc

      # `npx skills add` installs flat by frontmatter name, so two skills with
      # the same name silently clobber each other on the user's machine.
      - name: Skill names are unique
        run: |
          dupes=$(grep -h '^name:' skills/*/SKILL.md | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate skill names:"; echo "$dupes"; exit 1
          fi

      # A pointer that names a file which does not ship is invisible until a
      # reader follows it and finds nothing. Skill files and Reference files
      # are checked alike, because a dangling link inside a Reference file
      # strands its reader the same way.
      - name: Relative links under skills resolve
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            // A target carrying <angle brackets> is a template placeholder the
            // reader fills in, not a file that ships.
            const external = (t) => /^[a-z][a-z0-9+.-]*:/i.test(t) || t.startsWith("/") || t.startsWith("#") || /<[^>]*>/.test(t);
            let rc = 0;
            for (const f of walk("skills").filter((p) => p.endsWith(".md"))) {
              const raw = fs.readFileSync(f, "utf8");
              for (const m of raw.matchAll(/\[[^\]]*\]\(([^)\s]+)/g)) {
                const target = decodeURIComponent(m[1].trim().split(/[#?]/)[0]);
                if (!target || external(target)) continue;
                if (!fs.existsSync(path.join(path.dirname(f), target))) {
                  console.error(`${f}: link resolves to nothing: ${target}`);
                  rc = 1;
                }
              }
            }
            process.exit(rc);
          '

      # A Reference file that its skill file does not link is a file no reader
      # can be sent to. Each one is linked from the step in SKILL.md that reads
      # it, a Harness file from ## Harnesses, which is what makes a direct link
      # enough, so this needs no transitive crawl. Code under scripts/ is
      # reached by import and taught by --help, so only references/ counts.
      - name: Every file under a skill is linked from its skill file
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            // A target carrying <angle brackets> is a template placeholder the
            // reader fills in, not a file that ships.
            const external = (t) => /^[a-z][a-z0-9+.-]*:/i.test(t) || t.startsWith("/") || t.startsWith("#") || /<[^>]*>/.test(t);
            let rc = 0;
            for (const entry of fs.readdirSync("skills", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const root = path.join("skills", entry.name);
              const skill = path.join(root, "SKILL.md");
              if (!fs.existsSync(skill)) {
                console.error(`${root}: no SKILL.md`);
                rc = 1;
                continue;
              }
              const linked = new Set();
              for (const m of fs.readFileSync(skill, "utf8").matchAll(/\[[^\]]*\]\(([^)\s]+)/g)) {
                const target = decodeURIComponent(m[1].trim().split(/[#?]/)[0]);
                if (!target || external(target)) continue;
                linked.add(path.normalize(path.join(root, target)));
              }
              const refs = path.join(root, "references");
              if (!fs.existsSync(refs)) continue;
              for (const f of walk(refs)) {
                if (!linked.has(path.normalize(f))) {
                  console.error(`${f}: no direct link from ${skill}`);
                  rc = 1;
                }
              }
            }
            process.exit(rc);
          '

      # A Role reads the Harness file its `## Harnesses` section links. A
      # skill that ships one and leaves a Harness out of the section sends
      # that reader nowhere.
      - name: Every skill with a Harness file indexes every Harness
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            const NONE = "none: the inline text is complete";
            const slugOf = (name) => name.trim().toLowerCase().replace(/\s+/g, "-");
            const skills = fs.readdirSync("skills", { withFileTypes: true })
              .filter((e) => e.isDirectory() && fs.existsSync(path.join("skills", e.name, "SKILL.md")))
              .map((e) => path.join("skills", e.name));
            const shipped = new Map();
            for (const root of skills) {
              const slugs = walk(root)
                .map((f) => path.basename(f).match(/^harness-(.+)\.md$/))
                .filter(Boolean)
                .map((m) => m[1]);
              if (slugs.length) shipped.set(root, slugs);
            }
            const all = [...new Set([...shipped.values()].flat())].sort();
            let rc = 0;
            for (const root of shipped.keys()) {
              const skill = path.join(root, "SKILL.md");
              const lines = fs.readFileSync(skill, "utf8").split("\n");
              const start = lines.findIndex((l) => l.trim() === "## Harnesses");
              if (start < 0) {
                console.error(`${skill}: ships a Harness file and has no ## Harnesses section`);
                rc = 1;
                continue;
              }
              let end = lines.findIndex((l, i) => i > start && /^#{1,2} /.test(l));
              if (end < 0) end = lines.length;
              const section = lines.slice(start + 1, end);
              const linked = new Set();
              const none = new Set();
              for (const line of section) {
                for (const m of line.matchAll(/\]\(([^)\s]+)\)/g)) {
                  linked.add(path.normalize(m[1].split(/[#?]/)[0]));
                }
                const b = line.match(/^\s*-\s+([^:`]+):\s*(.*?)\s*$/);
                if (b && b[2] === NONE) none.add(slugOf(b[1]));
              }
              for (const slug of all) {
                const own = path.normalize(`references/harness-${slug}.md`);
                if (!linked.has(own) && !none.has(slug)) {
                  console.error(`${skill}: ## Harnesses has no entry for ${slug} (a link to ${own}, or "${NONE}")`);
                  rc = 1;
                }
              }
            }
            process.exit(rc);
          '

      # Claude Code, Cursor and Copilot CLI honour
      # `disable-model-invocation: true` in the frontmatter; Codex honours
      # `policy.allow_implicit_invocation: false` in agents/openai.yaml. Each
      # half is ignored by the Harnesses the other covers, so one half alone
      # leaves the skill model-invocable on those Harnesses.
      - name: User-invoked skills carry both halves of the pair
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            // find, not git ls-files, so a plain copy of the tree is checked too.
            const find = (...args) => execFileSync("find", ["skills", ...args], { encoding: "utf8" })
              .split("\n").filter(Boolean).map((p) => path.normalize(p));
            const frontmatter = (f) => {
              const lines = fs.readFileSync(f, "utf8").split("\n");
              if (lines[0] !== "---") return [];
              const end = lines.indexOf("---", 1);
              return end < 0 ? [] : lines.slice(1, end);
            };
            const implicitOff = (f) => {
              let top = null;
              for (const line of fs.readFileSync(f, "utf8").split("\n")) {
                const key = line.match(/^([A-Za-z_][\w-]*)\s*:/);
                if (key) { top = key[1]; continue; }
                const m = line.match(/^\s+allow_implicit_invocation\s*:\s*(\S+)\s*$/);
                if (m && top === "policy" && m[1] === "false") return true;
              }
              return false;
            };
            const policies = new Set(find("-type", "f", "-path", "*/agents/openai.yaml"));
            let rc = 0;
            for (const p of policies) {
              const skill = path.join(path.dirname(path.dirname(p)), "SKILL.md");
              if (!fs.existsSync(skill)) {
                console.error(`${p}: no SKILL.md beside its agents directory`);
                rc = 1;
              }
            }
            for (const skill of find("-mindepth", "2", "-maxdepth", "2", "-type", "f", "-name", "SKILL.md")) {
              const dir = path.dirname(skill);
              const blocked = frontmatter(skill).some((l) => /^disable-model-invocation:\s*true\s*$/.test(l));
              const p = path.join(dir, "agents", "openai.yaml");
              const off = policies.has(p) && implicitOff(p);
              if (blocked && !policies.has(p)) {
                console.error(`${dir}: disable-model-invocation: true and no agents/openai.yaml`);
                rc = 1;
              } else if (blocked && !off) {
                console.error(`${dir}: disable-model-invocation: true but ${p} does not set policy.allow_implicit_invocation: false`);
                rc = 1;
              } else if (!blocked && off) {
                console.error(`${dir}: ${p} sets policy.allow_implicit_invocation: false but the frontmatter lacks disable-model-invocation: true`);
                rc = 1;
              }
            }
            process.exit(rc);
          '

      # CLAUDE.md is read by Claude Code and wins precedence over AGENTS.md,
      # so a house rule added only to AGENTS.md would silently never reach
      # Claude Code, and a rule added to both would be read twice.
      - name: CLAUDE.md is a stub for AGENTS.md
        run: |
          if [ "$(cat CLAUDE.md)" != "@AGENTS.md" ]; then
            echo "CLAUDE.md must contain exactly the line: @AGENTS.md"
            exit 1
          fi

      # This plugin ships prose and one Python program at mode 644, run
      # through a named interpreter (python3, or py -3 on native Windows), and
      # exactly one hook: the Codex Stop hook inline in .codex-plugin/plugin.json,
      # which only Codex reads, in the fixed form below. No other hook, no MCP
      # servers, no symlinks and no executable files: each would end up on
      # every installer's machine. Codex's trust covers the hook's command
      # string, so a changed string is a hook every user trusts again. If
      # anything here changes deliberately, edit this step in the same PR so
      # the reviewer sees both.
      - name: Reject executable surface
        run: |
          rc=0
          while IFS= read -r entry; do
            mode=${entry%% *}
            case "$mode" in
              120000) echo "symlink in distributed content: ${entry#* }"; rc=1 ;;
              100755) echo "executable in distributed content: ${entry#* }"; rc=1 ;;
            esac
          done < <(git ls-files -s | awk '{print $1" "$4}')
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if grep -qE '"(hooks|mcpServers)"' "$f"; then
              echo "$f declares hooks or MCP servers; only .codex-plugin/plugin.json carries the one hook"; rc=1
            fi
          done
          node -e '
            const c = JSON.parse(require("fs").readFileSync(".codex-plugin/plugin.json", "utf8"));
            const hook = {
              type: "command",
              command: "[ ! -f LOOP.md ] || python3 \"${PLUGIN_ROOT}/skills/vdd-setup/scripts/vdd.py\" codex-stop || true",
              commandWindows: "if (Test-Path LOOP.md) { py -3 \"${PLUGIN_ROOT}\\skills\\vdd-setup\\scripts\\vdd.py\" codex-stop }; exit 0",
              timeout: 2760,
            };
            const expected = { hooks: { Stop: [{ hooks: [hook] }] } };
            let rc = 0;
            if (JSON.stringify(c.hooks) !== JSON.stringify(expected)) {
              console.error(".codex-plugin/plugin.json: hooks is not exactly the one Codex Stop hook in its fixed form");
              rc = 1;
            }
            if ("mcpServers" in c) { console.error(".codex-plugin/plugin.json declares MCP servers"); rc = 1; }
            process.exit(rc);
          ' || rc=1
          while IFS= read -r f; do
            echo "unexpected hook or MCP config: $f"; rc=1
          done < <(git ls-files | grep -E '(^|/)(hooks\.json|\.mcp\.json|mcp\.json)$' || true)
          # A `dependencies` key in agents/openai.yaml can declare tools and
          # MCP servers: `interface` and `policy` are the only keys allowed.
          while IFS= read -r f; do
            first=$(grep -vE '^([[:space:]]*#|[[:space:]]*$|---$)' "$f" | head -1)
            case "$first" in
              [[:space:]]*) echo "$f: top-level keys must start at column 0"; rc=1 ;;
            esac
            bad=$(grep -vE '^([[:space:]]|#|$|---$|\.\.\.$)' "$f" | grep -vE '^(interface|policy)[[:space:]]*:' || true)
            if [ -n "$bad" ]; then
              echo "$f: top-level keys other than interface and policy:"; echo "$bad"; rc=1
            fi
          done < <(find skills -type f -path '*/agents/openai.yaml')
          exit $rc

      # Shipped code runs on every installer's machine through a named
      # interpreter, so it is held to what that promise allows:
      # - File kinds as an allow list: under skills/ only .md,
      #   agents/openai.yaml and .py;
      #   elsewhere outside .github/, tests/ and docs/ only .md, the manifests'
      #   .json, .gitignore, .gitattributes and LICENSE. New code is .py, or a
      #   deliberate edit of this step.
      # - Every file under skills/ at mode 644, and no .py with a shebang:
      #   nothing runs by its own path.
      # - Every .py ASCII only: a non-ASCII byte reaches a Windows console in
      #   the ANSI code page as a different character.
      # - Every .py parses as Python 3.9, the floor Apple's Command Line Tools
      #   ship.
      # - Imports from the standard library and the tool's own package only,
      #   and no network module: nothing is installed and nothing is fetched.
      # - No shell=True, os.system, os.popen, eval, exec or __import__, and no
      #   import of importlib, runpy, posix or nt, any submodule included: no
      #   shell, no evaluated text and no import by a computed name. posix and
      #   nt hold the system and popen that os re-exports. The check resolves
      #   import aliases and refuses getattr on os, subprocess and builtins,
      #   and ** or extra positional arguments to a subprocess call, where
      #   shell=True can hide.
      # - No hooks key in a SKILL.md frontmatter: Claude Code registers one
      #   when the skill runs, a hook beside the one Codex Stop hook.
      # It reads git ls-files -s, so gitignored scratch files never count and a
      # mode reads the same on every OS. It needs the runner's Python (3.10+
      # for sys.stdlib_module_names).
      - name: Shipped code passes the static checks
        run: python3 .github/scripts/check_shipped_code.py

      # release.yml is the one workflow that may write to the repository, and
      # only from a version tag push or a workflow_dispatch. A pull_request
      # trigger there would run PR-head content with write access, and write
      # access anywhere else widens what any push or PR can do. The runner has
      # no YAML parser, so these are text checks on the lines that are not
      # comments. The patterns are spelled so this step's own text never
      # matches them when verify.yml itself is checked.
      - name: Only release.yml grants write access
        run: |
          rc=0
          r=.github/workflows/release.yml
          [ -f "$r" ] || { echo "missing $r"; exit 1; }
          trig=$(awk '/^[[:space:]]*#/ {next} /^on:[[:space:]]*$/ {f=1; next} /^[^[:space:]]/ {f=0} f && /^  [^[:space:]]/ {sub(/:.*/, ""); sub(/^ +/, ""); print}' "$r" | sort | paste -sd' ' -)
          [ "$trig" = "push workflow_dispatch" ] || { echo "$r: triggers are '$trig', expected push and workflow_dispatch"; rc=1; }
          push=$(awk '/^[[:space:]]*#/ {next} /^on:[[:space:]]*$/ {o=1; next} /^[^[:space:]]/ {o=0} o && /^  push:/ {p=1; next} o && /^  [^[:space:]]/ {p=0} o && p && /^    [^[:space:]]/ {sub(/:.*/, ""); sub(/^ +/, ""); print}' "$r" | sort | paste -sd' ' -)
          [ "$push" = "tags" ] || { echo "$r: push filters are '$push', expected tags only"; rc=1; }
          if awk '/^[[:space:]]*#/ {next} /pull_request/ {f=1} END {exit !f}' "$r"; then
            echo "$r: names a pull_request trigger"; rc=1
          fi
          perms=$(awk '/^[[:space:]]*#/ {next} /^permissions:/ {f=1; print; next} /^[^[:space:]]/ {f=0} f && NF' "$r" | paste -sd'|' -)
          [ "$perms" = "permissions:|  contents: read" ] || { echo "$r: workflow-level permissions are '$perms', expected contents read"; rc=1; }
          if ! awk '/^[[:space:]]*#/ {next} /^jobs:/ {j=1} !j && /contents:[[:space:]]*writ[e]/ {f=1} END {exit f}' "$r"; then
            echo "$r: grants contents write access outside a job"; rc=1
          fi
          writes=$(awk '/^[[:space:]]*#/ {next} /contents:[[:space:]]*writ[e]/ {n++} END {print n+0}' "$r")
          [ "$writes" = 1 ] || { echo "$r: grants contents write access in $writes places, expected the release job alone"; rc=1; }
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if awk '/^[[:space:]]*#/ {next} /write[-]all/ {f=1} END {exit !f}' "$f"; then
              echo "$f: grants every permission at once"; rc=1
            fi
            [ "$f" = "$r" ] && continue
            if awk '/^[[:space:]]*#/ {next} /contents:[[:space:]]*writ[e]/ {f=1} END {exit !f}' "$f"; then
              echo "$f: grants contents write access, which only release.yml's release job may"; rc=1
            fi
          done
          exit $rc

  # The VDD tool runs on the user's Python, on macOS, Linux and native
  # Windows, from 3.9 (Apple's Command Line Tools) to the newest release. A
  # new Python or a Windows path quirk fails a PR here, not a user. -B keeps
  # the runner from caching the test modules it imports; the tool turns
  # bytecode off itself. Ubuntu 24.04 for 3.9: later images ship no 3.9 build.
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9' }
          - { os: ubuntu-latest, python: '3.x' }
          - { os: windows-latest, python: '3.9' }
          - { os: windows-latest, python: '3.x' }
          - { os: macos-latest, python: '3.9' }
          - { os: macos-latest, python: '3.x' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the tool's tests
        run: python -B -m unittest discover -s tests
